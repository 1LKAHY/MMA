for(let [pos,i] of order.entries()){let sec=document.createElement('section');sec.innerHTML=`<small>QUESTION ${pos+1} / ${awards.length}</small><h2>${esc(awards[i][1])}</h2>`;for(let j=0;j<2;j++){let root=document.createElement('div');root.className='slot';sec.append(root);let s=state[i][j],type=awards[i][2];root.innerHTML=`<strong>${j?'두 번째':'첫 번째'} 투표</strong><div class="selection" aria-live="polite"></div><input placeholder="시나리오 검색"><div class="candidate-list"></div><div class="roles"></div><button type="button" class="clear">선택 취소</button>`;let q=root.querySelector('input'),list=root.querySelector('.candidate-list'),roles=root.querySelector('.roles'),sel=root.querySelector('.selection');function update(){sel.textContent=choice(i,s)|| (s.si===null?'아직 선택하지 않았습니다':data[s.si][0]+' · '+(type==='pair'?s.roles.length+'/4명':'추가 입력 필요'));sel.classList.toggle('has-selection',s.si!==null);progress()}function drawList(){list.replaceChildren();data.forEach((d,si)=>{if(!d[0].toLowerCase().includes(q.value.toLowerCase())||(type==='culprit'&&!candidates.some(c=>c.si===si&&c.culprit)))return;let b=document.createElement('button');b.className='candidate'+(s.si===si?' active':'');b.textContent=d[0];b.onclick=()=>{s.si=si;s.roles=[];s.text='';q.value=d[0];list.replaceChildren();drawRoles();update()};list.append(b)})}function drawRoles(){roles.replaceChildren();if(s.si===null)return;if(type==='text'){let t=document.createElement('textarea');t.placeholder=i===2?'기억에 남는 대사':'기억에 남는 장면';t.maxLength=500;t.value=s.text;t.oninput=()=>{s.text=t.value;update()};roles.append(t)}else if(type!=='scenario'){let search=document.createElement('input');search.placeholder='캐릭터 / 멤버 검색';let out=document.createElement('div');out.className='candidate-list';roles.append(search,out);function render(){out.replaceChildren();for(let c of candidates.filter(c=>c.si===s.si&&(type!=='culprit'||c.culprit)&&(c.member+' '+c.role).includes(search.value))){let b=document.createElement('button');let active=s.roles.includes(c);b.className='candidate'+(active?' active':'');b.textContent=(active?'✓ ':'')+c.member+' · '+c.role;b.disabled=type==='pair'&&s.roles.length>=4&&!active;b.onclick=()=>{s.roles=active?s.roles.filter(x=>x!==c):type==='pair'?[...s.roles,c]:[c];render();update()};out.append(b)}}search.oninput=render;render();if(type==='pair')roles.prepend('같은 작품에서 2~4명 선택')}if(type!=='text'){let t=document.createElement('textarea');t.placeholder='한줄평 (선택)';t.maxLength=500;t.value=s.comment;t.oninput=()=>{s.comment=t.value;progress()};roles.append(t)}}q.oninput=drawList;q.onfocus=drawList;root.querySelector('.clear').onclick=()=>{Object.assign(s,{si:null,roles:[],text:'',comment:''});q.value='';list.replaceChildren();drawRoles();update()};update()}$('ballot').append(sec)}
function answers(){return state.map((ss,i)=>ss.map(s=>({choice:choice(i,s),comment:s.comment.trim()})).filter(a=>a.choice))}function validate(){if(!$('member').value)throw Error('닉네임을 선택하세요.');for(let [i,ss] of state.entries()){if(ss.some(s=>s.si!==null&&!choice(i,s)))throw Error(awards[i][1]+' 선택을 완료하거나 취소하세요.');let a=ss.map(s=>choice(i,s)).filter(Boolean);if(new Set(a).size!==a.length)throw Error('동일 후보 중복 투표는 불가능합니다.')}if(!answers().some(a=>a.length))throw Error('한 부문 이상 투표하세요.');if(!token)throw Error('전용 투표 링크가 필요합니다.')}function review(){try{validate();let r=$('review');r.innerHTML='<h2>최종 확인</h2>'+order.map(i=>`<h3>${esc(awards[i][1])}</h3>${answers()[i].map(a=>`<p>${esc(a.choice)} ${esc(a.comment)}</p>`).join('')||'기권'}`).join('')+'<button onclick="submitVote(this)">서버에 제출</button>';r.classList.remove('hidden');r.scrollIntoView()}catch(e){alert(e.message)}}
async function rpc(name,args){if(!config.url||!config.key)throw Error('Supabase 설정 필요');let r=await fetch(config.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:config.key,'Content-Type':'application/json'},body:JSON.stringify(args)});if(!r.ok)throw Error('요청 실패 ('+r.status+')');return r.json()}async function submitVote(b){try{validate();b.disabled=true;await rpc('mma_submit',{p_name:$('member').value,p_token:token,p_answers:answers()});alert('투표가 서버에 저장되었습니다.')}catch(e){alert(e.message)}finally{b.disabled=false}}
let votes=[],merges={},authorized=false;try{merges=JSON.parse(localStorage.getItem('mma2026merges')||'{}')}catch{}function show(id){if(['admin','ceremony'].includes(id)&&!authorized)return;for(let x of ['vote','admin','ceremony'])$(x).classList.toggle('hidden',x!==id);document.body.classList.toggle('gala',id==='ceremony');window.scrollTo(0,0)}async function unlock(){let pw=prompt('관리자 비밀번호');if(!pw)return;try{votes=await rpc('mma_read',{p_password:pw});authorized=true;show('admin');$('count').textContent=`투표 완료 ${votes.length}/9명 · ${votes.map(v=>v.name).join(', ')}`;mergePanel()}catch(e){alert(e.message)}}function rows(i){return votes.flatMap(v=>(v.answers[i]||[]).map(a=>({...a,voter:v.name})))}function merged(i,x){return merges[i]?.[x]||x}function mergePanel(){let root=$('mergePanel');root.replaceChildren();for(let i=0;i<awards.length;i++){let opts=[...new Set(rows(i).map(a=>a.choice))];let h=document.createElement('h3');h.textContent=awards[i][0];root.append(h);for(let x of opts){let l=document.createElement('label');l.textContent=x;let s=document.createElement('select');for(let y of opts){let o=document.createElement('option');o.value=y;o.textContent=y;s.append(o)}s.value=merged(i,x);s.onchange=()=>{(merges[i]??={})[x]=s.value;localStorage.setItem('mma2026merges',JSON.stringify(merges))};l.append(s);root.append(l)}}}function rank(i){let m=new Map();for(let a of rows(i)){let x=merged(i,a.choice);if(!m.has(x))m.set(x,new Set());m.get(x).add(a.voter)}return [...m].map(([name,v])=>({name,n:v.size})).sort((a,b)=>b.n-a.n)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({votes,merges},null,2)],{type:'application/json'}));a.download='MMA-private-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let page=0;function start(){if(!votes.length)return alert('투표가 없습니다.');page=0;show('ceremony');render()}function step(n){page=Math.max(0,Math.min(awards.length*5+1,page+n));render()}function render(){let s=$('slide'),c=$('comments');c.classList.add('hidden');s.classList.remove('grand');if(page===0){s.innerHTML='<p>THE 1ST</p><div class="mma">MMA</div><h2>MURDER MYSTERY AWARDS</h2><p>2025 — 2026 · CHRISTMAS EDITION</p>';return}if(page===awards.length*5+1){s.innerHTML='<h2>전체 수상자</h2>'+awards.map((a,i)=>{let r=rank(i);return `<p>${esc(a[0])} · ${r.filter(x=>x.n===r[0]?.n).map(x=>esc(x.name)).join(' & ')||'유효 투표 없음'}</p>`}).join('')+'<h2>TO BE CONTINUED...</h2><p>Merry Christmas!</p>';return}let i=Math.floor((page-1)/5),stage=(page-1)%5,a=awards[i],r=rank(i),w=r.filter(x=>x.n===r[0]?.n);s.classList.toggle('grand',i>=awards.length-2);s.innerHTML=`<p>${i>=awards.length-2?'✦ GRAND PRIZE ✦':'MMA · '+(i+1)+' / '+awards.length}</p>`;if(stage===0){s.innerHTML+=`<div class="intro">${esc(a[4])}</div>${i===0?'<p>대상… 아니,</p>':''}<h2>${a[3]} ${esc(a[0])}</h2>`;return}s.innerHTML+=`<h2>${a[3]} ${esc(a[0])}</h2>`;if(stage===1){let cutoff=r[Math.min(2,r.length-1)]?.n;let nom=r.filter(x=>x.n>=cutoff).sort((x,y)=>x.name.localeCompare(y.name,'ko'));s.innerHTML+='<p>최종 후보 · 순위 비공개</p><div class="nominees">'+nom.map(x=>`<div>${esc(x.name)}</div>`).join('')+'</div>';return}if(stage===2||stage===3){s.innerHTML+=`<div class="winner">${w.map(x=>esc(x.name)).join('<br> & <br>')||'유효 투표 없음'}</div><p>${w.length>1?'공동 수상':'축하합니다!'}</p>`;if(stage===3){c.classList.remove('hidden');c.innerHTML='<h2>한줄평</h2>'+rows(i).filter(x=>w.some(y=>y.name===merged(i,x.choice))&&(x.comment||i===2)).map(x=>`<div class="comment">${esc(x.comment||x.choice)}</div>`).join('')}return}s.innerHTML+=r.map(x=>`<p>${esc(x.name)} · ${x.n}표</p><div class="bar" style="width:${100*x.n/Math.max(1,r[0]?.n||1)}%"></div>`).join('')}
</script></body></html>
